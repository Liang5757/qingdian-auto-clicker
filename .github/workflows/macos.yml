name: macOS CI
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build, test and package universal app
        run: |
          mkdir -p artifacts
          bash scripts/package-macos.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qingdian-macos-universal
          path: |
            artifacts/*-macos-universal.zip
            artifacts/*-macos-universal.zip.sha256

name: Cross-platform CI
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      matrix:
        platform: [x64, x86]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore Qingdian.AutoClicker.sln --locked-mode
      - run: dotnet build Qingdian.AutoClicker.sln -c Release --no-restore
      - run: dotnet test Qingdian.AutoClicker.sln -c Release --no-build --logger trx --results-directory TestResults -- RunConfiguration.TargetPlatform=${{ matrix.platform }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: tests-${{ matrix.platform }}
          path: TestResults/*.trx
  package:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - run: ./scripts/package.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qingdian-windows
          path: |
            artifacts/*-windows.zip
            artifacts/*.sha256

  macos:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build, test and package universal app
        run: |
          mkdir -p artifacts
          bash scripts/package-macos.sh
      - name: Render UI without input injection
        run: |
          unzip -q artifacts/*-macos-universal.zip -d artifacts/macos-preview
          artifacts/macos-preview/轻点.app/Contents/MacOS/Qingdian --render-preview artifacts/macos-ui.png
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qingdian-macos-universal
          path: |
            artifacts/*-macos-universal.zip
            artifacts/*-macos-universal.zip.sha256
            artifacts/macos-ui.png
